# Template: image nginx tu thay ${BACKEND_URL} khi container khoi dong.
# - Local (docker compose): BACKEND_URL=http://backend:8080 -> nginx chuyen /api, /uploads sang backend.
# - AWS: ALB da chuyen /api/*, /uploads/*, /actuator/* thang sang backend nen cac location nay
#   khong duoc goi toi; dat BACKEND_URL=http://127.0.0.1:8080 de nginx khoi dong duoc.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 500M;

    # Health check cho Target Group cua frontend
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass ${BACKEND_URL};
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
    }

    location /uploads/ {
        proxy_pass ${BACKEND_URL};
        proxy_set_header Host $host;
    }

    location /actuator/ {
        proxy_pass ${BACKEND_URL};
    }

    # File JS/CSS co hash trong ten -> cache lau
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # React Router: duong dan la tra ve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
