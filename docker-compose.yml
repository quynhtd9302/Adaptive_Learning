# Chay toan bo he thong o may local, mo phong dung kien truc AWS:
#   mysql  ~ Amazon RDS        redis ~ ElastiCache        minio ~ Amazon S3
#   backend/frontend ~ 2 service tren ECS, frontend:80 ~ ALB
#
#   docker compose up -d --build      -> mo http://localhost:3000
#   docker compose down -v            -> xoa sach (ca du lieu)
services:
  mysql:
    image: mysql:8.0
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports: ["3307:3306"]          # 3307 de khong dung MySQL dang cai tren may
    volumes: [mysql_data:/var/lib/mysql]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"]
      interval: 5s
      retries: 30

  redis:
    image: redis:7-alpine

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]   # 9001: giao dien quan ly (minioadmin/minioadmin)
    volumes: [minio_data:/data]

  backend:
    build: ./backend
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_started }
      minio: { condition: service_started }
    environment:
      SPRING_PROFILES_ACTIVE: prod     # chay giong het tren AWS
      # RDS
      DB_URL: jdbc:mysql://mysql:3306/adaptive_learning_db?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: root
      DB_PASSWORD: root
      # ElastiCache
      CACHE_TYPE: redis
      REDIS_HOST: redis
      REDIS_HEALTH: "true"
      # S3 (MinIO)
      STORAGE_TYPE: s3
      APP_UPLOAD_BASE_URL: /uploads
      S3_BUCKET: adaptive-learning-local
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_PATH_STYLE: "true"
      S3_CREATE_BUCKET: "true"
      AWS_REGION: ap-southeast-2
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    ports: ["8080:8080"]

  frontend:
    build: ./frontend
    depends_on: [backend]
    environment:
      BACKEND_URL: http://backend:8080
    ports: ["3000:80"]

volumes:
  mysql_data:
  minio_data:
